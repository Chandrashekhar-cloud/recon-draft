services:
  - type: web
    name: recon-app
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn "app.app:app" --workers 1 --threads 4 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ANTHROPIC_API_KEY
        sync: false
